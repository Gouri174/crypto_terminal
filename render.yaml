services:
  - type: web
    name: crypto-terminal-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: UNIVERSE_SIZE
        value: "40"
      - key: LLM_CANDIDATES
        value: "6"
