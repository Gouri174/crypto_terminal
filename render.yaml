services:
  - type: web
    name: crypto-terminal-backend
    runtime: python
    rootDir: backend
    plan: free
    # Binance's Futures API (fapi.binance.com) returns HTTP 451 for
    # US-based IPs specifically (Binance.US is a separate, futures-less
    # entity) — Render's default regions are Oregon/Virginia, both US.
    # Frankfurt sidesteps the geo-block, but its shared outbound IP pool
    # turned out to already be 418-banned by Binance (other Render
    # tenants' traffic, not ours — confirmed live, persisted across a
    # full restart). Singapore is a different shared pool; if it's also
    # banned, the real fix is a dedicated IP (see README's Deploying
    # section), not another region guess.
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: UNIVERSE_SIZE
        value: "40"
      - key: LLM_CANDIDATES
        value: "6"
